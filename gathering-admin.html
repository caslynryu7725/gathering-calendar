<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主辦人管理中心｜Gathering Calendar</title><style>
:root{--ink:#26372d;--muted:#78857d;--line:#e4eae5;--green:#3d7955;--pale:#e8f2eb;--bg:#fafcf9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC",sans-serif}
.wrap{max-width:920px;width:calc(100% - 32px);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.1em}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.15em;margin-top:4px}
nav{display:flex;gap:8px}.tab,.btn{border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font-weight:600}.tab{background:#eef3ef;color:var(--ink)}.tab.active,.btn{background:var(--green);color:white}
.hero{padding:38px 0 22px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--green);font-weight:bold}h1{font-size:clamp(27px,5vw,40px);margin:10px 0}p{color:var(--muted);line-height:1.65}
.card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 8px 28px #243b2b08}
label{display:block;font-size:13px;font-weight:700;margin:15px 0 7px}input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;color:var(--ink)}.muted{color:var(--muted);font-size:12px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin:22px 0 14px}.month{font-size:20px;font-weight:700}.secondary{background:#eef3ef;color:var(--ink)}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.weekday{text-align:center;color:var(--muted);font-size:12px;padding:8px 0}
.day{min-height:76px;border:1px solid var(--line);border-radius:11px;background:white;padding:8px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.day:hover{border-color:#91b39b}.day.selected{background:var(--pale);border:2px solid #6b9a79;padding:7px}.day:disabled{opacity:.25;cursor:not-allowed}.num{font-weight:700}.sub{font-size:10px;color:var(--muted)}.tick{color:var(--green);font-weight:bold;align-self:flex-end}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn{padding:12px 18px}.btn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-block;background:var(--pale);color:var(--green);padding:5px 9px;border-radius:30px;font-size:11px;margin:3px}
.notice{background:#eff6f0;color:#356a47;padding:12px;border-radius:10px;margin-top:14px;font-size:13px}.error{background:#fff0ee;color:#a33b31;padding:12px;border-radius:10px;margin-top:14px;font-size:13px}
.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f3f7f3;padding:15px;border-radius:12px}.stat span{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:26px;margin-top:5px}
.rank{display:grid;grid-template-columns:115px 1fr 45px;gap:10px;align-items:center;margin:14px 0;font-size:13px}.track{height:9px;background:#edf1ed;border-radius:20px;overflow:hidden}.fill{height:100%;background:#8caf98}.fill.best{background:var(--green)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted)}
footer{padding:25px 0;color:var(--muted);font-size:11px}
@media(max-width:600px){.card{padding:15px}.day{min-height:62px;padding:6px 4px}.day.selected{padding:5px 3px}.calendar{gap:4px}.sub{font-size:9px}.stats{gap:6px}.stat{padding:10px}.stat strong{font-size:21px}.rank{grid-template-columns:85px 1fr 38px;gap:6px}}
/* 送出成功提示視窗 */
.success-overlay{position:fixed;inset:0;z-index:9999;background:rgba(22,42,30,.48);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .22s ease}
.success-dialog{width:min(100%,370px);background:#fff;border-radius:24px;padding:32px 25px 25px;text-align:center;box-shadow:0 22px 70px rgba(20,55,33,.22);animation:popIn .32s cubic-bezier(.2,.8,.2,1)}
.success-icon{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:#e6f4e9;display:flex;align-items:center;justify-content:center}
.success-icon svg{width:55px;height:55px;fill:none;stroke:#348957;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:90;stroke-dashoffset:90;animation:drawCheck .55s .2s ease forwards}
.success-dialog h2{margin:0 0 9px;font-size:25px;color:#26372d}.success-dialog p{margin:0 0 22px;font-size:14px}.success-dialog .btn{width:100%;font-size:15px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes popIn{from{opacity:0;transform:translateY(15px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes drawCheck{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.success-overlay,.success-dialog,.success-icon svg{animation:none}.success-icon svg{stroke-dashoffset:0}}
.event-select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:var(--ink)}.event-tools{margin-top:24px;padding:18px;border:1px solid var(--line);border-radius:14px;background:#f8fbf8}.event-tools h3{margin:0 0 8px}

select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:white;font:inherit} .action-row{display:flex;gap:9px;flex-wrap:wrap} .action-row button{flex:1} .urlbox{overflow-wrap:anywhere;background:#f3f7f3;border-radius:9px;padding:12px;font-size:12px} .busy{opacity:.6;pointer-events:none} </style></head><body><main class="wrap"><header class="top"><div class="brand">GATHERING CALENDAR<small>時間日期調查平台</small></div></header><section class="hero"><div class="eyebrow">ORGANIZER DASHBOARD</div><h1>主辦人管理中心</h1><p>建立活動、複製賓客專屬連結、分開查看統計。賓客不會看到這個頁面的入口。</p></section><section class="card"><h2>管理密碼</h2><label for="pin">管理密碼（新增、修改、封存及刪除時使用）</label><input id="pin" type="password" autocomplete="off" placeholder="請輸入你的管理密碼"><div id="message"></div></section><section class="card"><h2>建立新活動</h2><div class="row"><div style="flex:2;min-width:160px"><label for="newTitle">活動名稱</label><input id="newTitle" maxlength="120" placeholder="例如：研究所期末聚餐"></div><div style="flex:1;min-width:140px"><label for="newStart">開始日期</label><input id="newStart" type="date"></div><div style="flex:1;min-width:140px"><label for="newEnd">結束日期</label><input id="newEnd" type="date"></div></div><button class="btn" id="create" style="margin-top:12px">＋ 建立活動並產生連結</button></section><section class="card"><div class="row between"><h2>活動管理與獨立統計</h2><button class="btn secondary" id="refresh">重新整理</button></div><label for="eventPicker">選擇要管理的活動</label><select id="eventPicker"></select><div id="linkPanel" style="margin-top:16px"><label>賓客專屬連結</label><div class="urlbox" id="guestLink"></div><div class="action-row" style="margin-top:10px"><button class="btn" id="copy">複製賓客連結</button><button class="btn secondary" id="openGuest">預覽賓客頁面</button></div></div><div class="row"><div style="flex:2;min-width:160px"><label for="title">活動名稱</label><input id="title"></div><div style="flex:1;min-width:140px"><label for="start">開始日期</label><input id="start" type="date"></div><div style="flex:1;min-width:140px"><label for="end">結束日期</label><input id="end" type="date"></div></div><div class="action-row" style="margin-top:12px"><button class="btn" id="save">儲存活動設定</button><button class="btn secondary" id="archive">封存／重新開放</button><button class="btn secondary" id="export">匯出此活動 CSV</button></div><div class="stats" style="margin-top:24px"><div class="stat"><span>已回覆人數</span><strong id="totalPeople">0</strong></div><div class="stat"><span>可選日期</span><strong id="totalDays">0</strong></div><div class="stat"><span>最高出席人數</span><strong id="maxCount">0</strong></div></div><h3>可出席人數排名</h3><div id="ranking"></div><h3>各日期出席名單</h3><div style="overflow-x:auto"><table><thead><tr><th>日期</th><th>人數</th><th>出席者</th></tr></thead><tbody id="attendeeTable"></tbody></table></div><h3>已填寫名單</h3><div style="overflow-x:auto"><table><thead><tr><th>姓名</th><th>選擇日期</th><th>操作</th></tr></thead><tbody id="peopleTable"></tbody></table></div></section><p class="muted">注意：管理頁面網址不是身分驗證。此版本的後端公開讀取介面仍可查詢賓客姓名與日期，請勿蒐集敏感資訊。</p><footer>GATHERING CALENDAR · 讓每一次相聚，都找到最好的時間。</footer></main><script>const API_URL='https://script.google.com/macros/s/AKfycbyyTYeja0tIHyB2fL0lWIbKRXzZcPYqiL95C6FFS1axVMJN6W9RCrcSRUhe4yfaiJIY/exec';const BASE_URL='https://caslynryu7725.github.io/gathering-calendar/time-date-survey-onepage.html';const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pad=n=>String(n).padStart(2,'0');const key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;const fmt=d=>{const x=new Date(d+'T12:00:00');return `${x.getFullYear()}/${x.getMonth()+1}/${x.getDate()}（${'日一二三四五六'[x.getDay()]}）`};
function getState(eventId){return new Promise((resolve,reject)=>{const cb='gcCallback'+Date.now()+Math.floor(Math.random()*100000);const s=document.createElement('script');let done=false;const timer=setTimeout(()=>finish(new Error('讀取逾時，請檢查 Apps Script 部署權限')),18000);function finish(err,data){if(done)return;done=true;clearTimeout(timer);delete window[cb];s.remove();err?reject(err):resolve(data)}window[cb]=data=>finish(null,data);s.onerror=()=>finish(new Error('無法連線到資料服務'));s.src=API_URL+'?callback='+cb+'&eventId='+encodeURIComponent(eventId||'')+'&t='+Date.now();document.head.appendChild(s)})}
async function post(action,payload){await fetch(API_URL,{method:'POST',mode:'no-cors',body:new URLSearchParams({action,payload:JSON.stringify(payload)})});await new Promise(r=>setTimeout(r,1100))}

let events=[],eventId='',people=[],settings={};const notice=(m,err=false)=>{$('message').innerHTML=`<div class="${err?'error':'notice'}">${esc(m)}</div>`};const link=()=>BASE_URL+'?event='+encodeURIComponent(eventId);const pin=()=>{if(!$('pin').value)throw Error('請先輸入管理密碼');return $('pin').value};
async function refresh(id){const data=await getState(id||eventId);if(!data.ok)throw Error(data.error||'讀取失敗');events=data.events||[];eventId=data.selectedEventId;people=data.people||[];settings=data.settings||{};$('eventPicker').innerHTML=events.map(e=>`<option value="${esc(e.id)}">${esc(e.title)}${e.active?'':'（已封存）'}</option>`).join('');$('eventPicker').value=eventId;$('title').value=settings.title||'';$('start').value=settings.start||'';$('end').value=settings.end||'';$('guestLink').textContent=link();const ev=events.find(e=>e.id===eventId);$('archive').textContent=ev&&ev.active?'封存此活動':'重新開放此活動';renderStats();return data}
function renderStats(){const counts={};if(settings.start&&settings.end){let d=new Date(settings.start+'T12:00:00'),end=new Date(settings.end+'T12:00:00');for(let i=0;d<=end&&i<400;i++,d.setDate(d.getDate()+1))counts[key(d.getFullYear(),d.getMonth(),d.getDate())]=people.filter(p=>p.dates.includes(key(d.getFullYear(),d.getMonth(),d.getDate()))).length}const ranked=Object.entries(counts).sort((a,b)=>b[1]-a[1]),max=ranked.length?ranked[0][1]:0;$('totalPeople').textContent=people.length;$('totalDays').textContent=Object.keys(counts).length;$('maxCount').textContent=max;$('ranking').innerHTML=ranked.slice(0,10).map(([d,n])=>`<div class="rank"><span>${fmt(d)}</span><div class="track"><div class="fill" style="width:${max?100*n/max:0}%"></div></div><b>${n} 人</b></div>`).join('')||'<p class="muted">尚無資料</p>';$('attendeeTable').innerHTML=Object.entries(counts).map(([d,n])=>`<tr><td>${fmt(d)}</td><td>${n}</td><td>${people.filter(p=>p.dates.includes(d)).map(p=>esc(p.name)).join('、')||'—'}</td></tr>`).join('');$('peopleTable').innerHTML=people.map((p,i)=>`<tr><td>${esc(p.name)}</td><td>${p.dates.map(fmt).join('、')}</td><td><button class="btn secondary" data-i="${i}">刪除</button></td></tr>`).join('')||'<tr><td colspan="3">尚無回覆</td></tr>';document.querySelectorAll('[data-i]').forEach(b=>b.onclick=async()=>{const name=people[Number(b.dataset.i)].name;if(!confirm('確定刪除 '+name+' 的回覆？'))return;try{await post('delete',{eventId,name,pin:pin()});await refresh(eventId);if(people.some(p=>p.name===name))throw Error('刪除尚未確認成功，請檢查密碼');notice('已刪除回覆')}catch(e){notice(e.message,true)}})}
$('eventPicker').onchange=async e=>{try{await refresh(e.target.value)}catch(err){notice(err.message,true)}};$('refresh').onclick=()=>refresh(eventId).then(()=>notice('已取得最新資料')).catch(e=>notice(e.message,true));$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(link());notice('已複製賓客專屬連結')}catch(e){const t=document.createElement('textarea');t.value=link();document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();notice('已複製連結')}};$('openGuest').onclick=()=>window.open(link(),'_blank');
$('create').onclick=async()=>{const title=$('newTitle').value.trim(),start=$('newStart').value,end=$('newEnd').value;if(!title||!start||!end||start>end){notice('請填寫有效活動名稱與日期',true);return}const btn=$('create');btn.disabled=true;try{const previous=new Set(events.map(e=>e.id));await post('createEvent',{title,start,end,eventId,pin:pin()});await refresh(eventId);const ev=events.find(e=>!previous.has(e.id));if(!ev)throw Error('尚未確認建立成功，請先重新整理確認');await refresh(ev.id);notice('新活動建立成功！請複製此活動的賓客專屬連結。');$('newTitle').value='';$('newStart').value='';$('newEnd').value=''}catch(e){notice(e.message,true)}finally{btn.disabled=false}};
$('save').onclick=async()=>{const title=$('title').value.trim(),start=$('start').value,end=$('end').value;if(!title||!start||!end||start>end){notice('活動設定無效',true);return}try{await post('settings',{eventId,title,start,end,pin:pin()});await refresh(eventId);if(settings.title!==title||settings.start!==start||settings.end!==end)throw Error('設定尚未確認成功');notice('已儲存活動設定')}catch(e){notice(e.message,true)}};
$('archive').onclick=async()=>{const before=events.find(e=>e.id===eventId);if(!before||!confirm(before.active?'確定封存此活動？':'確定重新開放此活動？'))return;try{await post('archiveEvent',{eventId,pin:pin()});await refresh(eventId);if(events.find(e=>e.id===eventId).active===before.active)throw Error('尚未確認狀態變更');notice('活動狀態已更新')}catch(e){notice(e.message,true)}};
$('export').onclick=()=>{const rows=[['活動名稱','姓名','可出席日期'],...people.map(p=>[settings.title,p.name,p.dates.join('、')])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='Gathering-'+settings.title.replace(/[\/:*?"<>|]/g,'_')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
refresh().catch(e=>notice('無法讀取活動：'+e.message,true));
</script></body></html>
