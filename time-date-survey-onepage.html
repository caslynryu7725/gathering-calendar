<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活動日期調查｜Gathering Calendar</title><style>
:root{--ink:#26372d;--muted:#78857d;--line:#e4eae5;--green:#3d7955;--pale:#e8f2eb;--bg:#fafcf9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC",sans-serif}
.wrap{max-width:920px;width:calc(100% - 32px);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.1em}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.15em;margin-top:4px}
nav{display:flex;gap:8px}.tab,.btn{border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font-weight:600}.tab{background:#eef3ef;color:var(--ink)}.tab.active,.btn{background:var(--green);color:white}
.hero{padding:38px 0 22px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--green);font-weight:bold}h1{font-size:clamp(27px,5vw,40px);margin:10px 0}p{color:var(--muted);line-height:1.65}
.card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 8px 28px #243b2b08}
label{display:block;font-size:13px;font-weight:700;margin:15px 0 7px}input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;color:var(--ink)}.muted{color:var(--muted);font-size:12px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin:22px 0 14px}.month{font-size:20px;font-weight:700}.secondary{background:#eef3ef;color:var(--ink)}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.weekday{text-align:center;color:var(--muted);font-size:12px;padding:8px 0}
.day{min-height:76px;border:1px solid var(--line);border-radius:11px;background:white;padding:8px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.day:hover{border-color:#91b39b}.day.selected{background:var(--pale);border:2px solid #6b9a79;padding:7px}.day:disabled{opacity:.25;cursor:not-allowed}.num{font-weight:700}.sub{font-size:10px;color:var(--muted)}.tick{color:var(--green);font-weight:bold;align-self:flex-end}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn{padding:12px 18px}.btn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-block;background:var(--pale);color:var(--green);padding:5px 9px;border-radius:30px;font-size:11px;margin:3px}
.notice{background:#eff6f0;color:#356a47;padding:12px;border-radius:10px;margin-top:14px;font-size:13px}.error{background:#fff0ee;color:#a33b31;padding:12px;border-radius:10px;margin-top:14px;font-size:13px}
.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f3f7f3;padding:15px;border-radius:12px}.stat span{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:26px;margin-top:5px}
.rank{display:grid;grid-template-columns:115px 1fr 45px;gap:10px;align-items:center;margin:14px 0;font-size:13px}.track{height:9px;background:#edf1ed;border-radius:20px;overflow:hidden}.fill{height:100%;background:#8caf98}.fill.best{background:var(--green)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted)}
footer{padding:25px 0;color:var(--muted);font-size:11px}
@media(max-width:600px){.card{padding:15px}.day{min-height:62px;padding:6px 4px}.day.selected{padding:5px 3px}.calendar{gap:4px}.sub{font-size:9px}.stats{gap:6px}.stat{padding:10px}.stat strong{font-size:21px}.rank{grid-template-columns:85px 1fr 38px;gap:6px}}
.admin-link{display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:#eef3ef;color:#26372d;border:1px solid #dbe7de;border-radius:10px;padding:11px 14px;font-size:13px;font-weight:700;white-space:nowrap}.admin-link:hover{background:#e0ede3}.ranking-header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.ranking-note{font-size:12px;color:var(--muted)}.rank-number{font-weight:700;color:var(--green)}@media(max-width:600px){.brand{font-size:12px}.brand small{font-size:9px}.admin-link{font-size:12px;padding:9px 10px}}
/* 送出成功提示視窗 */
.success-overlay{position:fixed;inset:0;z-index:9999;background:rgba(22,42,30,.48);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .22s ease}
.success-dialog{width:min(100%,370px);background:#fff;border-radius:24px;padding:32px 25px 25px;text-align:center;box-shadow:0 22px 70px rgba(20,55,33,.22);animation:popIn .32s cubic-bezier(.2,.8,.2,1)}
.success-icon{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:#e6f4e9;display:flex;align-items:center;justify-content:center}
.success-icon svg{width:55px;height:55px;fill:none;stroke:#348957;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:90;stroke-dashoffset:90;animation:drawCheck .55s .2s ease forwards}
.success-dialog h2{margin:0 0 9px;font-size:25px;color:#26372d}.success-dialog p{margin:0 0 22px;font-size:14px}.success-dialog .btn{width:100%;font-size:15px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes popIn{from{opacity:0;transform:translateY(15px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes drawCheck{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.success-overlay,.success-dialog,.success-icon svg{animation:none}.success-icon svg{stroke-dashoffset:0}}
.event-select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:var(--ink)}.event-tools{margin-top:24px;padding:18px;border:1px solid var(--line);border-radius:14px;background:#f8fbf8}.event-tools h3{margin:0 0 8px}

select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:white;font:inherit} .action-row{display:flex;gap:9px;flex-wrap:wrap} .action-row button{flex:1} .urlbox{overflow-wrap:anywhere;background:#f3f7f3;border-radius:9px;padding:12px;font-size:12px} .busy{opacity:.6;pointer-events:none} </style></head><body><main class="wrap"><header class="top"><div class="brand">GATHERING CALENDAR<small>時間日期調查平台</small></div><a class="admin-link" href="gathering-admin.html" aria-label="前往主辦人管理中心">⚙ 主辦人管理</a></header><section class="hero"><div class="eyebrow">FIND A DATE. GATHER EVERYONE.</div><h1 id="mainTitle">正在載入活動…</h1><p id="mainDesc">請填寫姓名並選擇您可以出席的日期。</p></section><section class="card" id="guestView"><label for="guestName">您的姓名</label><input id="guestName" maxlength="60" placeholder="請輸入姓名"><div class="calhead"><button class="btn secondary" id="prev">← 上個月</button><div class="month" id="monthLabel"></div><button class="btn secondary" id="next">下個月 →</button></div><div class="calendar" id="calendar"></div><div class="row between" style="margin-top:15px"><span class="muted" id="selectedCount">已選擇 0 個日期</span><button class="btn secondary" id="clear">清除選擇</button></div><div id="selectedDates"></div><button class="btn" id="submit" style="width:100%;margin-top:18px" disabled>確認並送出</button><div id="guestMessage"></div><p class="muted">同一活動使用相同姓名再次填寫會更新原本回覆。</p></section><section class="card" id="popularCard"><div class="ranking-header"><h2 style="margin:0">最熱門日期 TOP 10</h2><button class="btn secondary" id="refreshRanking" type="button">↻ 更新排名</button></div><p class="ranking-note">依本活動目前已回覆賓客的可出席人數排序，與其他活動分開統計。</p><div id="rankingStatus" class="muted" role="status">正在讀取排名…</div><div id="guestRanking" aria-live="polite"></div></section><footer>GATHERING CALENDAR · 讓每一次相聚，都找到最好的時間。</footer></main><div id="successOverlay" class="success-overlay hidden"><div class="success-dialog" role="dialog" aria-modal="true" aria-labelledby="successTitle"><div class="success-icon"><svg viewBox="0 0 60 60"><path d="M12 31 L25 43 L49 17"/></svg></div><h2 id="successTitle">填寫完成！</h2><p id="successDescription"></p><button class="btn" id="successClose">完成</button></div></div><script>const API_URL='https://script.google.com/macros/s/AKfycbyyTYeja0tIHyB2fL0lWIbKRXzZcPYqiL95C6FFS1axVMJN6W9RCrcSRUhe4yfaiJIY/exec';const BASE_URL='https://caslynryu7725.github.io/gathering-calendar/time-date-survey-onepage.html';const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pad=n=>String(n).padStart(2,'0');const key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;const fmt=d=>{const x=new Date(d+'T12:00:00');return `${x.getFullYear()}/${x.getMonth()+1}/${x.getDate()}（${'日一二三四五六'[x.getDay()]}）`};
function getState(eventId){return new Promise((resolve,reject)=>{const cb='gcCallback'+Date.now()+Math.floor(Math.random()*100000);const s=document.createElement('script');let done=false;const timer=setTimeout(()=>finish(new Error('讀取逾時，請檢查 Apps Script 部署權限')),18000);function finish(err,data){if(done)return;done=true;clearTimeout(timer);delete window[cb];s.remove();err?reject(err):resolve(data)}window[cb]=data=>finish(null,data);s.onerror=()=>finish(new Error('無法連線到資料服務'));s.src=API_URL+'?callback='+cb+'&eventId='+encodeURIComponent(eventId||'')+'&t='+Date.now();document.head.appendChild(s)})}
async function post(action,payload){await fetch(API_URL,{method:'POST',mode:'no-cors',body:new URLSearchParams({action,payload:JSON.stringify(payload)})});await new Promise(r=>setTimeout(r,1100))}

const eventId=new URLSearchParams(location.search).get('event');let rankingPeople=[];let settings=null,selected=new Set(),year=new Date().getFullYear(),month=new Date().getMonth();
function render(){if(!settings)return;$('monthLabel').textContent=`${year} 年 ${month+1} 月`;let h=['日','一','二','三','四','五','六'].map(d=>`<div class="weekday">週${d}</div>`).join('');for(let i=0;i<new Date(year,month,1).getDay();i++)h+='<div></div>';for(let d=1;d<=new Date(year,month+1,0).getDate();d++){const k=key(year,month,d),ok=k>=settings.start&&k<=settings.end;h+=`<button class="day ${selected.has(k)?'selected':''}" data-date="${k}" ${ok?'':'disabled'}><span class="num">${d}</span><span class="sub">星期${'日一二三四五六'[new Date(year,month,d).getDay()]}</span><span class="tick">${selected.has(k)?'✓':''}</span></button>`}$('calendar').innerHTML=h;document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selected.has(b.dataset.date)?selected.delete(b.dataset.date):selected.add(b.dataset.date);render()});$('selectedCount').textContent=`已選擇 ${selected.size} 個日期`;$('selectedDates').innerHTML=[...selected].sort().map(d=>`<span class="pill">${fmt(d)}</span>`).join('')}
function renderRanking(people){rankingPeople=Array.isArray(people)?people:[];const status=$('rankingStatus'),root=$('guestRanking');root.replaceChildren();if(!settings){status.textContent='尚未載入活動';return}const counts=new Map();let day=new Date(settings.start+'T12:00:00'),end=new Date(settings.end+'T12:00:00');for(let i=0;day<=end&&i<400;i++,day.setDate(day.getDate()+1)){const d=key(day.getFullYear(),day.getMonth(),day.getDate());counts.set(d,0)}for(const person of rankingPeople){const dates=new Set(Array.isArray(person.dates)?person.dates:[]);for(const d of dates)if(counts.has(d))counts.set(d,counts.get(d)+1)}const ranked=[...counts.entries()].filter(([d,n])=>n>0).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,10);if(!ranked.length){status.textContent='目前還沒有賓客回覆，歡迎成為第一位！';return}status.textContent=`目前已有 ${rankingPeople.length} 位賓客回覆；同票數依日期先後排序。`;const max=ranked[0][1];for(const [i,[d,n]] of ranked.entries()){const item=document.createElement('div');item.className='rank';const label=document.createElement('span');label.textContent=`${i+1}. ${fmt(d)}`;const track=document.createElement('div');track.className='track';const fill=document.createElement('div');fill.className='fill'+(i===0?' best':'');fill.style.width=(100*n/max)+'%';track.appendChild(fill);const value=document.createElement('b');value.textContent=n+' 人';item.append(label,track,value);root.appendChild(item)}}
async function refreshRanking(){if(!eventId||!settings)return;const btn=$('refreshRanking');btn.disabled=true;$('rankingStatus').textContent='正在更新排名…';try{const data=await getState(eventId);if(!data.ok||data.selectedEventId!==eventId)throw Error(data.error||'活動資料不一致');renderRanking(data.people||[])}catch(e){$('rankingStatus').textContent='更新失敗：'+e.message}finally{btn.disabled=false}}
$('refreshRanking').onclick=refreshRanking;
$('prev').onclick=()=>{if(--month<0){month=11;year--}render()};$('next').onclick=()=>{if(++month>11){month=0;year++}render()};$('clear').onclick=()=>{selected.clear();render()};$('successClose').onclick=()=>{$('successOverlay').classList.add('hidden')};
async function load(){if(!eventId){$('rankingStatus').textContent='請使用有效活動連結查看排名';$('mainTitle').textContent='請使用主辦人提供的活動專屬連結';$('guestMessage').innerHTML='<div class="error">此網址缺少活動代碼，無法填寫。</div>';return}try{const data=await getState(eventId);if(!data.ok)throw Error(data.error||'讀取失敗');const ev=(data.events||[]).find(e=>e.id===eventId);if(!ev||data.selectedEventId!==eventId)throw Error('活動不存在，請確認連結');settings=data.settings;renderRanking(data.people||[]);$('mainTitle').textContent=ev.title;document.title=ev.title+'｜Gathering Calendar';$('mainDesc').textContent=`可選日期：${fmt(ev.start)} 至 ${fmt(ev.end)}`;if(!ev.active){$('guestMessage').innerHTML='<div class="error">此活動已封存，不再接受回覆。</div>';return}const d=new Date(settings.start+'T12:00:00');year=d.getFullYear();month=d.getMonth();$('submit').disabled=false;render()}catch(e){$('mainTitle').textContent='無法開啟活動';$('guestMessage').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
$('submit').onclick=async()=>{const name=$('guestName').value.trim(),dates=[...selected].sort();if(!name||!dates.length){$('guestMessage').innerHTML='<div class="error">請輸入姓名並至少選擇一個日期。</div>';return}const btn=$('submit');btn.disabled=true;btn.textContent='正在確認資料…';$('guestMessage').textContent='';try{await post('submit',{eventId,name,dates});let confirmed=false;for(let i=0;i<5;i++){const d=await getState(eventId);const saved=(d.people||[]).find(p=>p.name.toLowerCase()===name.toLowerCase());if(saved&&JSON.stringify([...saved.dates].sort())===JSON.stringify(dates)){confirmed=true;renderRanking(d.people||[]);break}await new Promise(r=>setTimeout(r,900))}if(!confirmed)throw Error('尚未確認資料寫入，請先查看是否已有紀錄，避免重複送出');$('successDescription').textContent=`${name}，您的 ${dates.length} 個可出席日期已成功儲存。謝謝您的回覆！`;$('successOverlay').classList.remove('hidden');$('successClose').focus()}catch(e){$('guestMessage').innerHTML=`<div class="error">${esc(e.message)}</div>`}finally{btn.disabled=false;btn.textContent='確認並送出'}};load();
</script></body></html>
